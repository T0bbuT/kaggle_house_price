[project]
name = "kaggle-house-prices"
version = "0.1.0"
description = "Kaggle「House Prices - Advanced Regression Techniques」の住宅価格予測分析"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "japanize-matplotlib>=1.1.3",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "numpy>=2.4.2",
    "optuna>=4.7.0",
    "pandas>=3.0.1",
    "plotly>=6.5.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "xgboost>=3.0.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4.0",
    "kaggle>=2.2.5",
    "nbconvert>=7.16.0",
]

[tool.uv]
package = false
